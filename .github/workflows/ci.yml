name: CI

# Runs on every push and pull request, and is reused by the publish workflow so images are only
# pushed from a green build.
on:
  push:
    branches: [release]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The integration tests start a real PostgreSQL through Testcontainers (Docker is available on the runner).
      - name: Test
        run: ./mvnw -B -ntp verify
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          retention-days: 14

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: pp-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Create a throw-away environment
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48)"
            echo "COOKIE_SECURE=false"
            echo "FRONTEND_PORT=3000"
          } > .env
      - name: Build and start the whole stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: The web app answers and the API is reachable through its proxy
        run: |
          curl -fsS -o /dev/null http://localhost:3000/login
          curl -fsS -o /dev/null -w "csrf: %{http_code}\n" http://localhost:3000/api/auth/csrf
          # unauthenticated access to protected data must be refused
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/folders)" = "401"
          # the backend itself is not exposed on the host
          ! curl -fsS --max-time 2 http://localhost:8080/actuator/health
      - name: Register, upload an image and check it lands in the image volume
        run: |
          jar=$(mktemp)
          curl -fsS -c "$jar" -o /dev/null http://localhost:3000/api/auth/csrf
          token=$(awk '$6=="XSRF-TOKEN"{print $7}' "$jar")
          curl -fsS -b "$jar" -c "$jar" -X POST http://localhost:3000/api/auth/register \
            -H "X-XSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"a-long-ci-password","displayName":"CI"}'
          printf '\x89PNG\r\n\x1a\n0000000000' > pixel.png
          curl -fsS -b "$jar" -X POST http://localhost:3000/api/images -H "X-XSRF-TOKEN: $token" -F file=@pixel.png
          test "$(docker compose exec -T backend sh -c 'find /data/images -type f | wc -l')" = "1"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
